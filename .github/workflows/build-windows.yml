# ThoughtVault Windows MSI build and publication on GitHub Actions.
# Gitea is the source repository; dispatch an explicit verified GitHub source ref.
name: Build Windows MSI

on:
  push:
    tags:
      - 'v*'
      - 'dev-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all release checks (false builds a private candidate only)'
        required: true
        default: true
        type: boolean
      channel:
        description: 'Build channel'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '20'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and channel
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "channel=production" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/dev-v* ]]; then
            echo "version=${GITHUB_REF_NAME#dev-v}" >> $GITHUB_OUTPUT
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "channel=${{ inputs.channel || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: Set artifact names
        id: names
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          CHANNEL="${{ steps.meta.outputs.channel }}"
          if [ "$CHANNEL" = "production" ]; then
            echo "msi_name=ThoughtVault_${VERSION}_x64.msi" >> $GITHUB_OUTPUT
            echo "bundle_id=nl.prezent.transcript-studio" >> $GITHUB_OUTPUT
            echo "product_name=ThoughtVault" >> $GITHUB_OUTPUT
            echo "feed=stable" >> $GITHUB_OUTPUT
          else
            echo "msi_name=ThoughtVault-Dev_${VERSION}_x64.msi" >> $GITHUB_OUTPUT
            echo "bundle_id=nl.prezent.transcript-studio-dev" >> $GITHUB_OUTPUT
            echo "product_name=ThoughtVault Dev" >> $GITHUB_OUTPUT
            echo "feed=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: windows
        run: npm ci

      - name: Verify ThoughtVault project identity
        run: python scripts/test-project-identity.py

      - name: Verify frontend and native code
        working-directory: windows
        run: |
          npx vitest run
          if ($LASTEXITCODE -ne 0) { throw "Frontend tests failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Frontend build failed" }
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { throw "Native tests failed" }

      - name: Build Tauri app
        working-directory: windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: '{"identifier":"${{ steps.names.outputs.bundle_id }}","productName":"${{ steps.names.outputs.product_name }}","plugins":{"updater":{"endpoints":["https://thoughtvault.yinga.ai/releases/windows/${{ steps.names.outputs.feed }}.json"]}}}'
        run: npm run tauri build

      - name: Copy and upload MSI
        shell: bash
        env:
          MSI_NAME: ${{ steps.names.outputs.msi_name }}
        run: |
          mkdir -p build
          MSI=$(find windows/src-tauri/target/release/bundle -name "*.msi" -type f | head -1)
          if [ -z "$MSI" ]; then
            echo "ERROR: MSI not found"
            exit 1
          fi
          cp "$MSI" "build/$MSI_NAME"
          cp "$MSI.sig" "build/$MSI_NAME.sig"
          echo "Built: $MSI_NAME"

      - name: Verify installed app and upgrade
        if: steps.meta.outputs.channel == 'production'
        shell: pwsh
        run: |
          $Feed = Invoke-RestMethod 'https://thoughtvault.yinga.ai/releases/windows/stable.json'
          $Url = [Uri]$Feed.platforms.'windows-x86_64'.url
          if ($Url.Scheme -ne 'https' -or $Url.Host -ne 'thoughtvault.yinga.ai') { throw "Unexpected previous installer URL" }
          New-Item -ItemType Directory -Force build/previous | Out-Null
          Invoke-WebRequest $Url.AbsoluteUri -OutFile build/previous/ThoughtVault.msi
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-installer.ps1 -Installer "build/${{ steps.names.outputs.msi_name }}" -PreviousInstaller "build/previous/ThoughtVault.msi"
          if ($LASTEXITCODE -ne 0) { throw "Installation verification failed" }

      - name: Require reviewed ThoughtVault presentation
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: python scripts/check-windows-design.py

      - name: Upload to server
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        env:
          MSI_NAME: ${{ steps.names.outputs.msi_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 3.69.205.209 >> ~/.ssh/known_hosts

          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/upload.ps1 -Channel "$CHANNEL" -KeyPath "$USERPROFILE/.ssh/id_rsa"
          if [ "$?" -ne 0 ]; then exit 1; fi

      - name: Retain installer and signature
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thoughtvault-windows-${{ steps.meta.outputs.version }}
          path: |
            build/*.msi
            build/*.sig
            build/*.log
            build/INSTALL-VERIFICATION.txt
          retention-days: 30
