name: Windows installer verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
          cache-on-failure: true
          key: installer-complete
      - name: Build and test installer
        shell: pwsh
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: ./scripts/build-windows-local.ps1
      - name: Verify installation and launch
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build/windows-local/*.msi).FullName
          $log = "$pwd/build/windows-local/install.log"
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles/ThoughtVault" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Installed executable not found" }
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Application exited: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
          "MSI installed successfully; application stayed running for 10 seconds." | Out-File build/windows-local/INSTALL-VERIFICATION.txt
      - name: Source evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-local | Out-Null
          Copy-Item SOURCE-SHA256.json build/windows-local/
          git rev-parse HEAD | Out-File build/windows-local/SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ThoughtVault-Windows-x64
          path: build/windows-local/
          retention-days: 30
