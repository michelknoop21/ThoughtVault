name: Release Build

on:
  push:
    tags:
      - 'v*'        # Production: git tag v1.0.50 && git push github v1.0.50
      - 'dev-v*'    # Dev: git tag dev-v1.0.50 && git push github dev-v1.0.50
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - production

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'

jobs:
  # Extract version and determine channel
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      dmg_name: ${{ steps.names.outputs.dmg_name }}
      msi_x64_name: ${{ steps.names.outputs.msi_x64_name }}
      apk_name: ${{ steps.names.outputs.apk_name }}
      app_display_name: ${{ steps.names.outputs.app_display_name }}
      bundle_id_macos: ${{ steps.names.outputs.bundle_id_macos }}
      bundle_id_windows: ${{ steps.names.outputs.bundle_id_windows }}
      tauri_product_name: ${{ steps.names.outputs.tauri_product_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v1.0.50 → 1.0.50
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/dev-v* ]]; then
            # dev-v1.0.50 → 1.0.50
            echo "version=${GITHUB_REF_NAME#dev-v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Determine channel
        id: channel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "channel=production" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/dev-v* ]]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            echo "channel=${{ inputs.channel || 'dev' }}" >> $GITHUB_OUTPUT
          fi

      - name: Set artifact names
        id: names
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.channel.outputs.channel }}"

          if [ "$CHANNEL" = "production" ]; then
            echo "dmg_name=TranscriptStudio-${VERSION}.dmg" >> $GITHUB_OUTPUT
            echo "msi_x64_name=TranscriptStudio_${VERSION}_x64.msi" >> $GITHUB_OUTPUT
            echo "apk_name=TranscriptStudio-${VERSION}.apk" >> $GITHUB_OUTPUT
            echo "app_display_name=TranscriptStudio" >> $GITHUB_OUTPUT
            echo "bundle_id_macos=nl.prezent.TranscriptStudio" >> $GITHUB_OUTPUT
            echo "bundle_id_windows=nl.prezent.transcript-studio" >> $GITHUB_OUTPUT
            echo "tauri_product_name=TranscriptStudio" >> $GITHUB_OUTPUT
          else
            echo "dmg_name=TranscriptStudio-Dev-${VERSION}.dmg" >> $GITHUB_OUTPUT
            echo "msi_x64_name=TranscriptStudio-Dev_${VERSION}_x64.msi" >> $GITHUB_OUTPUT
            echo "apk_name=TranscriptStudio-Dev-${VERSION}.apk" >> $GITHUB_OUTPUT
            echo "app_display_name=TranscriptStudio Dev" >> $GITHUB_OUTPUT
            echo "bundle_id_macos=nl.prezent.TranscriptStudio.dev" >> $GITHUB_OUTPUT
            echo "bundle_id_windows=nl.prezent.transcript-studio-dev" >> $GITHUB_OUTPUT
            echo "tauri_product_name=TranscriptStudio Dev" >> $GITHUB_OUTPUT
          fi

          echo "Channel: $CHANNEL"
          echo "Version: $VERSION"

  # macOS: build DMG
  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      APP_DISPLAY_NAME: ${{ needs.prepare.outputs.app_display_name }}
      BUNDLE_ID_MACOS: ${{ needs.prepare.outputs.bundle_id_macos }}
      DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Xcode archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TranscriptStudio.xcodeproj \
            -scheme TranscriptStudio \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/TranscriptStudio.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            SWIFT_VERSION=5 \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID_MACOS" \
            PRODUCT_NAME="$APP_DISPLAY_NAME" \
            2>&1 | tee /tmp/xcodebuild.log | tail -30

      - name: Show build errors (if failed)
        if: failure()
        run: grep -A 5 "error:" /tmp/xcodebuild.log || true

      - name: Export and sign app
        run: |
          mkdir -p build/export
          APP_PATH=$(find build/TranscriptStudio.xcarchive/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive"
            find build/TranscriptStudio.xcarchive/Products -type d
            exit 1
          fi
          cp -R "$APP_PATH" build/export/
          APP_NAME=$(basename "$APP_PATH")
          codesign --force --deep --sign - "build/export/$APP_NAME"

      - name: Create styled DMG
        run: |
          # Generate background image
          python3 scripts/create-dmg-background.py

          # Determine .app name from export
          APP_NAME=$(ls build/export/ | grep '\.app$' | sed 's/\.app$//')
          echo "App name: $APP_NAME"

          # Add Applications symlink
          ln -sf /Applications build/export/Applications

          # Create writable DMG
          hdiutil create \
            -volname "$APP_DISPLAY_NAME $VERSION" \
            -srcfolder build/export \
            -ov -format UDRW -fs HFS+ \
            build/tmp_rw.dmg

          # Mount, style, unmount
          MOUNT_DIR=$(hdiutil attach -readwrite -noverify -noautoopen build/tmp_rw.dmg | awk '/Apple_HFS/ {for(i=3;i<=NF;i++) printf "%s ", $i; print ""}' | sed 's/ *$//')
          echo "Mounted at: $MOUNT_DIR"

          mkdir -p "$MOUNT_DIR/.background"
          cp scripts/dmg-background.png "$MOUNT_DIR/.background/background.png"

          VOLNAME="$APP_DISPLAY_NAME $VERSION"
          osascript << APPLESCRIPT
          tell application "Finder"
              tell disk "$VOLNAME"
                  open
                  set current view of container window to icon view
                  set toolbar visible of container window to false
                  set statusbar visible of container window to false
                  set bounds of container window to {100, 100, 760, 500}
                  set viewOptions to icon view options of container window
                  set arrangement of viewOptions to not arranged
                  set icon size of viewOptions to 80
                  set text size of viewOptions to 12
                  set background picture of viewOptions to file ".background:background.png"
                  set position of item "$APP_NAME.app" of container window to {165, 200}
                  set position of item "Applications" of container window to {495, 200}
                  close
                  open
                  update without registering applications
                  delay 1
                  close
              end tell
          end tell
          APPLESCRIPT

          sync
          hdiutil detach "$MOUNT_DIR" -quiet

          # Convert to compressed read-only DMG
          hdiutil convert build/tmp_rw.dmg -format UDZO -imagekey zlib-level=9 -o "build/$DMG_NAME"
          rm -f build/tmp_rw.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/${{ env.DMG_NAME }}

  # Windows: build MSI (x64)
  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      BUNDLE_ID_WINDOWS: ${{ needs.prepare.outputs.bundle_id_windows }}
      TAURI_PRODUCT_NAME: ${{ needs.prepare.outputs.tauri_product_name }}
      MSI_X64_NAME: ${{ needs.prepare.outputs.msi_x64_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: windows
        run: npm install

      - name: Build Tauri app
        working-directory: windows
        env:
          TAURI_CONFIG: '{"identifier":"${{ env.BUNDLE_ID_WINDOWS }}","productName":"${{ env.TAURI_PRODUCT_NAME }}"}'
        run: npm run tauri build

      - name: Copy MSI to build dir
        shell: bash
        run: |
          mkdir -p build
          MSI=$(find windows/src-tauri/target/release/bundle -name "*.msi" -type f | head -1)
          if [ -z "$MSI" ]; then
            echo "ERROR: MSI not found"
            exit 1
          fi
          cp "$MSI" "build/$MSI_X64_NAME"
          echo "Built: $MSI_X64_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: build/${{ env.MSI_X64_NAME }}

  # Android: build APK
  build-android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      APK_NAME: ${{ needs.prepare.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: transcript-studio-android
        run: ./gradlew assembleRelease

      - name: Copy APK to build dir
        run: |
          mkdir -p build
          APK=$(find transcript-studio-android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find transcript-studio-android/app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "build/$APK_NAME"
          echo "Built: $APK_NAME ($(du -h "build/$APK_NAME" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/${{ env.APK_NAME }}

  # Upload artifacts to server
  deploy:
    needs: [prepare, build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      DMG_NAME: ${{ needs.prepare.outputs.dmg_name }}
      MSI_X64_NAME: ${{ needs.prepare.outputs.msi_x64_name }}
      APK_NAME: ${{ needs.prepare.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: List artifacts
        run: ls -lh build/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 3.69.205.209 >> ~/.ssh/known_hosts

      - name: Upload to server
        env:
          SERVER: michelk@3.69.205.209
          REMOTE_DIR: /home/michelk/tstudio-releases
        run: |
          ssh $SERVER "mkdir -p $REMOTE_DIR"

          HAS_MACOS=false
          HAS_WINDOWS_X64=false
          HAS_ANDROID=false

          if [ -f "build/$DMG_NAME" ]; then
            scp "build/$DMG_NAME" "$SERVER:$REMOTE_DIR/$DMG_NAME"
            echo "Uploaded: $DMG_NAME"
            HAS_MACOS=true
          fi

          if [ -f "build/$MSI_X64_NAME" ]; then
            scp "build/$MSI_X64_NAME" "$SERVER:$REMOTE_DIR/$MSI_X64_NAME"
            echo "Uploaded: $MSI_X64_NAME"
            HAS_WINDOWS_X64=true
          fi

          if [ -f "build/$APK_NAME" ]; then
            scp "build/$APK_NAME" "$SERVER:$REMOTE_DIR/$APK_NAME"
            echo "Uploaded: $APK_NAME"
            HAS_ANDROID=true
          fi

          # Upload website pages
          if [ -f "scripts/download-page.html" ]; then
            scp scripts/download-page.html "$SERVER:$REMOTE_DIR/index.html"
            echo "Updated: download page"
          fi
          if [ -f "scripts/features-page.html" ]; then
            scp scripts/features-page.html "$SERVER:$REMOTE_DIR/features.html"
            echo "Updated: features page"
          fi

          # Upload screenshots
          if [ -d "scripts/screenshots" ]; then
            ssh $SERVER "mkdir -p $REMOTE_DIR/screenshots"
            scp scripts/screenshots/*.png "$SERVER:$REMOTE_DIR/screenshots/"
            echo "Updated: screenshots"
          fi

          # Update releases.json — dev writes to dev_* fields, production to existing fields
          ssh $SERVER "python3 -c \"
          import json

          manifest_path = '$REMOTE_DIR/releases.json'
          try:
              with open(manifest_path) as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              data = {}

          channel = '$CHANNEL'

          if channel == 'production':
              data['latest_version'] = '$VERSION'
              if '$HAS_MACOS' == 'true':
                  data['macos'] = {
                      'url': '/tstudio/download/$DMG_NAME',
                      'version': '$VERSION',
                      'filename': '$DMG_NAME'
                  }
              if '$HAS_WINDOWS_X64' == 'true':
                  data['windows_x64'] = {
                      'url': '/tstudio/download/$MSI_X64_NAME',
                      'version': '$VERSION',
                      'filename': '$MSI_X64_NAME'
                  }
                  data['windows'] = {
                      'url': '/tstudio/download/$MSI_X64_NAME',
                      'version': '$VERSION',
                      'filename': '$MSI_X64_NAME'
                  }
              if '$HAS_ANDROID' == 'true':
                  data['android'] = {
                      'url': '/tstudio/download/$APK_NAME',
                      'version': '$VERSION',
                      'filename': '$APK_NAME'
                  }
          else:
              data['dev_latest_version'] = '$VERSION'
              if '$HAS_MACOS' == 'true':
                  data['dev_macos'] = {
                      'url': '/tstudio/download/$DMG_NAME',
                      'version': '$VERSION',
                      'filename': '$DMG_NAME'
                  }
              if '$HAS_WINDOWS_X64' == 'true':
                  data['dev_windows_x64'] = {
                      'url': '/tstudio/download/$MSI_X64_NAME',
                      'version': '$VERSION',
                      'filename': '$MSI_X64_NAME'
                  }
              if '$HAS_ANDROID' == 'true':
                  data['dev_android'] = {
                      'url': '/tstudio/download/$APK_NAME',
                      'version': '$VERSION',
                      'filename': '$APK_NAME'
                  }

          with open(manifest_path, 'w') as f:
              json.dump(data, f, indent=2)

          print('Updated releases.json (' + channel + ')')
          \""

          echo ""
          echo "$CHANNEL release $VERSION deployed!"
          echo "  macOS:    https://n8n.prezent.nl/tstudio/download/$DMG_NAME"
          echo "  Windows:  https://n8n.prezent.nl/tstudio/download/$MSI_X64_NAME"
          echo "  Android:  https://n8n.prezent.nl/tstudio/download/$APK_NAME"
          echo "  Manifest: https://n8n.prezent.nl/tstudio/download/releases.json"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # Extract the first changelog section (everything between first and second "---")
          NOTES=$(awk '/^---$/{n++} n==1{if(!/^---$/)print} n==2{exit}' docs/CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION ($CHANNEL)"
          fi
          # Write to file to preserve formatting
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PRERELEASE=""

          # For workflow_dispatch (no tag), create the tag first
          if [[ "$TAG_NAME" != v* ]] && [[ "$TAG_NAME" != dev-v* ]]; then
            if [ "$CHANNEL" = "production" ]; then
              TAG_NAME="v$VERSION"
            else
              TAG_NAME="dev-v$VERSION"
            fi
            git tag "$TAG_NAME" || true
            git push origin "$TAG_NAME" 2>/dev/null || true
          fi

          # Dev releases are pre-releases
          if [ "$CHANNEL" = "dev" ]; then
            PRERELEASE="--prerelease"
            TITLE="TranscriptStudio Dev v$VERSION"
          else
            TITLE="TranscriptStudio v$VERSION"
          fi

          # Collect available artifacts
          ARTIFACTS=""
          [ -f "build/$DMG_NAME" ] && ARTIFACTS="$ARTIFACTS build/$DMG_NAME"
          [ -f "build/$MSI_X64_NAME" ] && ARTIFACTS="$ARTIFACTS build/$MSI_X64_NAME"
          [ -f "build/$APK_NAME" ] && ARTIFACTS="$ARTIFACTS build/$APK_NAME"

          # Delete existing release for this tag (in case of re-deploy)
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true

          gh release create "$TAG_NAME" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE \
            $ARTIFACTS
