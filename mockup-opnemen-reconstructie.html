<head>

<style>

/* AppWindow */

<div class="win s-idle" id="win">

<script>
'use strict';
const CONFIG={
  env:{analysisWindowMs:30,publishHz:30,initialFloorDb:-60,minFloorDb:-75,maxFloorDb:-35,gateStartOffsetDb:3,gateEndOffsetDb:9,
       visMinFloorDb:-55,visMinOffsetDb:6,visMaxDb:-8,exponent:0.65,attackMs:35,releaseMs:220,silenceThreshold:0.015,
       historyLength:90,floorHistoryMs:2000,speechOffsetDb:12,floorFallTcMs:500,floorRiseTcMs:2000},
  wave:{heightFrac:.38,knee:2.2,taperPow:1.1,carrierCycles:2.3,travelHz:.3,energyBoost:.25,breath:.012,lines:12,glow:16,
    bellies:[{c:.32,w:.14,delay:0,f:.037},{c:.52,w:.13,delay:90,f:.053},{c:.73,w:.13,delay:180,f:.071}],
    drift:{center:.04,width:.2},
    // kleur langs x: magenta links, violet/lavendel midden, koel blauw rechts
    stops:[[0,[255,80,210]],[.3,[190,80,255]],[.5,[235,200,255]],[.72,[170,90,255]],[1,[90,140,255]]]},
  fixture:{sr:48000,noiseDb:-68,segments:[
    {t0:1.0,t1:2.5,type:'steady',db:-40},{t0:2.5,t1:5.0,type:'syll',db:-22,hz:4},{t0:5.0,t1:5.6,type:'steady',db:-10}],length:7.1}
};
/* ============ envelope: 1-op-1 port van AudioEnvelopeProcessor.swift ============ */
class EnvelopeProcessor{
  constructor(){this.reset()}
  reset(){this.floorDb=CONFIG.env.initialFloorDb;this.smoothed=0;this.hist=[];this.histMs=0;this.lastDb=-120;this.gate=0}
  static a(dtMs,tc){return 1-Math.exp(-dtMs/tc)}
  process(rawDb,dt){
    const C=CONFIG.env;
    const db=Math.min(0,Math.max(-120,Number.isFinite(rawDb)?rawDb:-120));
    const dtMs=Math.max(1,Math.min(250,dt*1000));
    this.hist.push({db,dtMs});this.histMs+=dtMs;
    while(this.histMs-this.hist[0].dtMs>C.floorHistoryMs&&this.hist.length>1)this.histMs-=this.hist.shift().dtMs;
    const sorted=this.hist.map(h=>h.db).sort((x,y)=>x-y);
    const cand=sorted[Math.floor(sorted.length/5)];
    const isSpeech=db>this.floorDb+C.speechOffsetDb;
    if(cand<this.floorDb)this.floorDb+=(cand-this.floorDb)*EnvelopeProcessor.a(dtMs,C.floorFallTcMs);
    else if(!isSpeech)this.floorDb+=(cand-this.floorDb)*EnvelopeProcessor.a(dtMs,C.floorRiseTcMs);
    this.floorDb=Math.min(C.maxFloorDb,Math.max(C.minFloorDb,this.floorDb));
    const ss=(e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t)};
    this.gate=ss(this.floorDb+C.gateStartOffsetDb,this.floorDb+C.gateEndOffsetDb,db);
    const visMin=Math.max(this.floorDb+C.visMinOffsetDb,C.visMinFloorDb);
    const norm=Math.min(1,Math.max(0,(db-visMin)/(C.visMaxDb-visMin)));
    const target=Math.pow(norm,C.exponent)*this.gate;
    const tc=target>this.smoothed?C.attackMs:C.releaseMs;
    this.smoothed+=(target-this.smoothed)*EnvelopeProcessor.a(dtMs,tc);
    this.lastDb=db;
    return this.smoothed<C.silenceThreshold?0:this.smoothed;
  }
}

/* ============ audiobronnen ============ */
const Audio_={ctx:null,an:null,buf:null,stream:null,src:null,t0:0,simT:0,
  async start(kind){
    this.kind=kind;this.simT=0;
    if(kind==='sim')return;
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.an=this.ctx.createAnalyser();this.an.fftSize=2048;this.buf=new Float32Array(2048);
    if(kind==='mic'){
      this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      this.src=this.ctx.createMediaStreamSource(this.stream);this.src.connect(this.an); // niet naar destination: geen feedback
    }else{
      const b=makeFixture(this.ctx);const s=this.ctx.createBufferSource();s.buffer=b;s.connect(this.an);
      const mute=this.ctx.createGain();mute.gain.value=0;this.an.connect(mute).connect(this.ctx.destination);
      s.start();this.src=s;
    }
    await this.ctx.resume();
  },
  pause(){if(this.ctx)this.ctx.suspend()},
  resume(){if(this.ctx)this.ctx.resume()},
  stop(){
    if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null} // microfoon vrijgeven
    if(this.ctx){this.ctx.close();this.ctx=null}
    this.an=null;this.src=null;
  },
  position(){return this.kind==='sim'?this.simT:(this.ctx?this.ctx.currentTime:0)},
  dbNow(dt){
    if(this.kind==='sim'){this.simT+=dt;return simDb(this.simT)}
    if(!this.an)return -120;
    this.an.getFloatTimeDomainData(this.buf);
    const n=Math.round(this.ctx.sampleRate*CONFIG.env.analysisWindowMs/1000);
    let s=0;for(let i=this.buf.length-n;i<this.buf.length;i++)s+=this.buf[i]*this.buf[i];
    const rms=Math.sqrt(s/n);return rms>0?20*Math.log10(rms):-120;
  }
};
function simDb(t){ // expliciet gesimuleerd: zinnen met pauzes
  const phrase=Math.sin(2*Math.PI*t/6.5)>-0.15;
  const syl=Math.abs(Math.sin(Math.PI*3.6*t));
  return phrase?-34+14*Math.pow(syl,.7)+2*Math.sin(t*7.1):-68+Math.sin(t*13)*1.5;
}
function makeFixture(ctx){ // deterministisch: geen Math.random
  const F=CONFIG.fixture,sr=ctx.sampleRate,n=Math.round(F.length*sr);
  const b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);
  const nz=Math.pow(10,F.noiseDb/20)*Math.sqrt(3);
  let seed=1;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1};
  const H=8,unit=1/Math.sqrt(Array.from({length:H},(_,k)=>1/((k+1)*(k+1))/2).reduce((a,b)=>a+b,0));
  for(let i=0;i<n;i++){
    const t=i/sr;let v=rnd()*nz;
    for(const s of F.segments){
      if(t<s.t0||t>=s.t1)continue;
      const edge=Math.min(1,(t-s.t0)/0.01,(s.t1-t)/0.01);
      let env=1;if(s.type==='syll')env=Math.pow(Math.max(0,Math.sin(2*Math.PI*s.hz*(t-s.t0))),.6)*1.25;
      const amp=Math.pow(10,s.db/20)*unit*env*edge;
      const f0=130+6*Math.sin(2*Math.PI*.7*t);let x=0;
      for(let k=1;k<=H;k++)x+=Math.sin(2*Math.PI*f0*k*t)/k;
      v+=amp*x;
    }
    d[i]=Math.max(-1,Math.min(1,v));
  }
  return b;
}

/* ---------- opname-state ---------- */
const R={phase:'idle',elapsed:0,proc:new EnvelopeProcessor(),hist:new Array(CONFIG.env.historyLength).fill(0),level:0,db:-120,drift:0,travel:0,time:0,last:performance.now(),
  speak:0,sil:0,silRun:0,spoke:false,marks:0};
setInterval(()=>{
  const now=performance.now(),dt=(now-R.last)/1000;R.last=now;let lvl=0;
  if(R.phase==='recording'){R.elapsed+=dt;R.db=Audio_.dbNow(dt);lvl=R.proc.process(R.db,dt);
    // Live inzichten (nieuw): spreektijd = tijd met level > 0; stilte = >1,5 s zonder level na spraak
    if(lvl>0){R.speak+=dt;R.spoke=true;R.silRun=0}else{R.silRun+=dt;if(R.spoke&&R.silRun>=1.5){R.sil++;R.spoke=false}}}
  else if(R.phase==='idle'){R.db=-120;R.proc.reset()}
  R.level=lvl;R.hist.push(lvl);R.hist.shift();
},1000/CONFIG.env.publishHz);

/* ---------- AudioWaveStage ---------- */
const TAU=Math.PI*2,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hsh=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const N=CONFIG.wave.lines;
const LINES=Array.from({length:N},(_,j)=>j===N-1?{px:2.4,a:1,k:1,main:true}:{px:.7+.8*hsh(j),a:.35+.4*hsh(j+7),k:.3+.7*(j/(N-2)),ph:(hsh(j+3)-.5)*.9});
function envAt(ms){const H=R.hist,f=H.length-1-ms/(1000/CONFIG.env.publishHz),i0=Math.max(0,Math.floor(f)),i1=Math.min(H.length-1,i0+1),u=f-Math.floor(f);return H[i0]*(1-u)+H[i1]*u}
function drawWave(cv){
  const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const C=CONFIG.wave,cy=H/2,maxH=H*C.heightFrac,lvl=R.level,td=RM?0:R.drift,tr=RM?0:R.travel;
  const bl=C.bellies.map((b,i)=>({c:b.c+C.drift.center*Math.sin(TAU*b.f*td+i*2.1),w:b.w*(1+C.drift.width*Math.sin(TAU*b.f*.83*td+i*1.3)),
    amp:[1,.8,.6][i]*(RM?lvl:envAt(b.delay))}));
  const step=2,n=Math.floor(W/step)+1;
  // hoofdcurve; steunlijnen zijn geschaalde, licht verschoven kopieën (lint-effect zoals referentie)
  const ys=LINES.map(()=>new Float32Array(n));
  for(let p=0;p<n;p++){
    const x=p/(n-1),taper=Math.pow(Math.max(0,Math.sin(Math.PI*x)),C.taperPow);
    for(let j=0;j<N;j++){const L=LINES[j];let s=0;
      for(let i=0;i<3;i++){const b=bl[i],z=(x-b.c)/b.w;
        const k=L.main?1:L.k*(1+.25*Math.sin(TAU*.05*td+j+i));
        s+=b.amp*k*Math.exp(-.5*z*z)*Math.sin(TAU*C.carrierCycles*(x-b.c)-tr+(L.ph||0)*(1+i*.4))}
      ys[j][p]=Math.tanh(s*C.knee)*maxH*taper+H*C.breath*Math.sin(TAU*1.3*x+(RM?0:R.time*.9)+j*.3)*taper}
  }
  g.globalCompositeOperation='lighter';
  const quiet=.55+.45*Math.min(1,lvl*2);
  for(let j=0;j<N;j++){
    const L=LINES[j],a=L.main?1:L.a*quiet,gr=g.createLinearGradient(0,0,W,0);
    for(const [o,c] of C.stops)gr.addColorStop(o,`rgba(${c[0]},${c[1]},${c[2]},${a*(o===0||o===1?.85:1)})`);
    g.beginPath();for(let p=0;p<n;p++){const X=p*step,Y=cy-ys[j][p];p?g.lineTo(X,Y):g.moveTo(X,Y)}
    g.lineWidth=L.px;g.strokeStyle=gr;
    g.shadowColor=L.main?'rgba(230,120,255,.9)':'rgba(170,80,255,.6)';g.shadowBlur=L.main?C.glow:(j%3===0?6:0);
    g.stroke();
  }
  g.shadowBlur=0;g.globalCompositeOperation='source-over';
}

/* ---------- gedrag ---------- */
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function setState(){
  const w=$('win'),p=R.phase;
  w.className='win s-'+(p==='recording'?'rec':p==='paused'?'pause':'idle');
  $('st').textContent=p==='recording'?'OPNAME ACTIEF':p==='paused'?'OPNAME GEPAUZEERD':'KLAAR OM OP TE NEMEN';
  $('listentxt').textContent=p==='recording'?'Ik luister...':p==='paused'?'Gepauzeerd':'Klaar';
  $('b-pause').innerHTML=ic(p==='paused'?'play':'pause','i fill');$('b-pause').setAttribute('aria-label',p==='paused'?'Hervat opname':'Pauzeer opname');
  $('l-pause').textContent=p==='paused'?'Hervat':'Pauzeer';
  $('b-pause').disabled=$('b-mark').disabled=p==='idle';
  const m=$('b-main');m.className='tb '+(p==='idle'?'rec':'stop');m.setAttribute('aria-label',p==='idle'?'Start opname':'Stop en verwerk');
  $('l-main').textContent=p==='idle'?'Start opname':p==='paused'?'Verstuur opname':'Stop en verwerk';
}
async function start(){R.elapsed=R.speak=R.sil=R.silRun=R.marks=0;R.spoke=false;R.proc.reset();R.hist.fill(0);
  try{await Audio_.start($('src').value)}catch(e){Audio_.stop();$('listentxt').textContent='Microfoon niet beschikbaar';return}
  R.last=performance.now();R.phase='recording';setState()}
function togglePause(){if(R.phase==='recording'){Audio_.pause();R.phase='paused'}else if(R.phase==='paused'){Audio_.resume();R.last=performance.now();R.phase='recording'}setState()}
function stop(){Audio_.stop();R.phase='idle';setState()}
function mark(){if(R.phase==='idle')return;R.marks++;flash('m')}
function flash(k){const b=document.querySelector(`[data-q="${k}"]`);b.classList.add('flash');setTimeout(()=>b.classList.remove('flash'),220)}
$('b-main').onclick=()=>R.phase==='idle'?start():stop();
$('b-pause').onclick=togglePause;$('b-mark').onclick=mark;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>b.dataset.q==='m'?mark():flash(b.dataset.q));
$('fb').onchange=()=>{$('fbtxt').textContent=$('fb').checked?'Aan':'Uit'};
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.target.matches('input,select'))return;
  const k=e.key.toLowerCase();if(k==='m')mark();else if('tnd'.includes(k)&&k.length===1)flash(k);else if(e.code==='Space'){e.preventDefault();R.phase==='idle'?start():togglePause()}});
$('src').onchange=()=>{if(R.phase!=='idle')stop()};

let lastT=performance.now();
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;R.time+=dt;
  if(R.phase!=='paused'){R.drift+=dt;R.travel+=dt*TAU*CONFIG.wave.travelHz*(1+CONFIG.wave.energyBoost*R.level)}
  document.documentElement.style.setProperty('--lvl',R.level.toFixed(3));
  drawWave($('wave'));
  $('timer').textContent=fmt(R.elapsed);$('i-speak').textContent=fmt(R.speak);$('i-sil').textContent=R.sil;$('i-mark').textContent=R.marks;
  [...$('lb').children].forEach((b,k)=>{const v=envAt(k*40);b.style.height=(3+11*v*(1-k/12))+'px';b.style.opacity=1-k*.07});
  const on=Math.round(R.level*9*1.3);[...$('i-lvl').children].forEach((b,k)=>{b.style.height=(6+k*1.2)+'px';b.classList.toggle('on',k<on)});
  requestAnimationFrame(frame);
}

if(P.get('clean'))$('review').hidden=true;if(P.get('src'))$('src').value=P.get('src');
