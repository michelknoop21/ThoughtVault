[package]
name = "transcript-studio"
version = "0.1.0"
description = "TranscriptStudio - Meeting recorder and transcription app"
authors = ["Prezent Internet B.V."]
edition = "2021"

[lib]
name = "transcript_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "transcript-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell          = "2"
tauri-plugin-deep-link      = "2"
tauri-plugin-notification   = "2"
tauri-plugin-store          = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "multipart", "stream"] }
futures-util = "0.3"

# Audio recording
cpal  = "0.15"
hound = "3.5"

# Credentials
keyring = "3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4"] }
dirs   = "5"

# Windows 11 native visual effects (Mica, Acrylic)
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# Windows-specific: nothing extra needed — cpal uses WASAPI by default on Windows
