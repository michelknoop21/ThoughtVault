# Ship the runtime inside the binary: a clean PC must not require MSVCP140.dll.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[env]
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
# Build-server AVX-512 instructions crash Whisper on AVX2 desktop CPUs.
GGML_NATIVE = "OFF"
GGML_AVX2 = "ON"
GGML_AVX512 = "OFF"
GGML_BMI2 = "OFF"
