[package]
name = "transcript-studio"
version = "1.0.148"
description = "TranscriptStudio - Meeting recorder and transcription app"
authors = ["Prezent Internet B.V."]
edition = "2021"
default-run = "transcript-studio"

[lib]
name = "transcript_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "transcript-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell          = "2"
tauri-plugin-deep-link      = "2"
tauri-plugin-notification   = "2"
tauri-plugin-store          = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-fs            = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["io"] }
reqwest     = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"

# Audio recording
cpal  = "0.15"
hound = "3.5"

# Credentials
keyring = "3"

# Utilities
chrono   = { version = "0.4", features = ["serde"] }
dirs     = "5"
tempfile = "3"
sha2     = "0.10"


# Windows 11 native visual effects (Mica, Acrylic)
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
# Windows-specific: nothing extra needed — cpal uses WASAPI by default on Windows
