[package]
name = "thoughtvault"
version = "1.0.286"
description = "ThoughtVault - Meeting recorder and transcription app"
authors = ["Prezent Internet B.V."]
edition = "2021"
default-run = "thoughtvault"

[lib]
name = "thoughtvault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "thoughtvault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell          = "2"
tauri-plugin-updater        = "~2.10.0"
tauri-plugin-deep-link      = "2"
tauri-plugin-notification   = "2"
tauri-plugin-store          = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-fs            = "2"
tauri-plugin-dialog        = "2"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["io"] }
reqwest     = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"

# Audio recording
cpal  = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }

# Local transcription (whisper.cpp bindings). Builds whisper.cpp from source —
# requires CMake + a C/C++ toolchain on the build machine. CPU inference by default.
# 0.16 uses bindgen 0.72, which supports LLVM 22 on current Windows build hosts.
whisper-rs = "0.16"

# Credentials
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Utilities
chrono   = { version = "0.4", features = ["serde"] }
dirs     = "6"
tempfile = "3"
sha2     = "0.10"


# Windows 11 native visual effects (Mica, Acrylic)
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]

[target.'cfg(windows)'.dependencies]
# Windows-specific: nothing extra needed — cpal uses WASAPI by default on Windows
